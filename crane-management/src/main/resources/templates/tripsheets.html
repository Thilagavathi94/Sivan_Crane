<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Sheet - Sivan Crane Service</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: topbar}"></div>
<div class="d-flex">
  <div class="sidebar-col">
    <div th:replace="~{fragments :: sidebar('tripsheets')}"></div>
  </div>
  <div class="flex-grow-1 p-4">
    <div class="alert alert-info d-flex justify-content-between align-items-center"
         th:if="${selectedCrane != null}">
      <div>
        <strong th:text="${selectedCrane.craneNo}">KCN-01</strong>
        <span>trip history:</span>
        <strong th:text="${craneTripCount}">0</strong>
        <span>trips</span>
      </div>
      <a th:href="@{/tripsheets}" class="btn btn-sm btn-outline-secondary">Show All</a>
    </div>

    <div class="row g-3">
      <div class="col-md-5">
        <div class="card-panel">
          <div class="panel-title">📋 <span th:text="${tripSheet.id != null ? 'Edit Trip Sheet' : 'New Trip Sheet'}">New Trip Sheet</span></div>
          <div class="alert alert-danger py-2" th:if="${error}" th:text="${error}">Error</div>
          <form th:action="@{/tripsheets/save}" th:object="${tripSheet}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="mb-2">
              <label class="form-label">Trip Sheet No</label>
              <input type="text" th:field="*{tripSheetNo}" class="form-control" placeholder="e.g. TS-00001" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Linked Booking (optional)</label>
              <select th:field="*{booking}" class="form-select">
                <option value="">-- Walk-in / No Booking --</option>
                <option th:each="b : ${bookings}" th:value="${b.id}" th:text="${b.bookingNo} + ' - ' + ${b.customer.name}">Booking</option>
              </select>
            </div>
            <div class="mb-2">
              <label class="form-label">Billing Type *</label>
              <select th:field="*{billingType}" class="form-select" required>
                <option value="Regular">Regular</option>
                <option value="GST">GST</option>
              </select>
              <div class="form-text">GST trip sheets require the selected customer's GST number.</div>
            </div>
            <div class="mb-2">
              <label class="form-label">Client *</label>
              <select th:field="*{customer}" class="form-select" required>
                <option value="">Select Client</option>
                <option th:each="c : ${customers}" th:value="${c.id}" th:text="${c.name + (c.gstNumber != null and !#strings.isEmpty(c.gstNumber) ? ' - GST: ' + c.gstNumber : '')}">Customer</option>
              </select>
            </div>
            <div class="mb-2">
              <label class="form-label">Crane *</label>
              <select th:field="*{crane}" class="form-select" required>
                <option value="">Select Crane</option>
                <option th:each="c : ${cranes}" th:value="${c.id}" th:text="${c.craneNo} + ' (' + ${c.capacity} + ')'">Crane</option>
              </select>
            </div>
            <div class="row">
              <div class="col-6 mb-2">
                <label class="form-label">Date</label>
                <input type="date" th:field="*{tripDate}" class="form-control">
              </div>
              <div class="col-6 mb-2">
                <label class="form-label">Total Hours</label>
                <input type="number" step="0.5" th:field="*{totalHours}" class="form-control">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Amount</label>
              <input type="number" step="0.01" th:field="*{amount}" class="form-control" placeholder="0.00">
            </div>
            <button type="submit" class="btn btn-brand-orange w-100">Save Trip Sheet</button>
          </form>
        </div>
      </div>

      <div class="col-md-7">
        <div class="card-panel">
          <div class="panel-title">All Trip Sheets</div>
          <div class="table-responsive">
            <table class="table table-sm">
              <thead><tr><th>Trip No</th><th>Client</th><th>Type</th><th>Crane</th><th>Date</th><th>Hours</th><th>Amount</th><th>Action</th></tr></thead>
              <tbody>
                <tr th:each="t : ${tripSheets}">
                  <td th:text="${t.tripSheetNo}">TS-00001</td>
                  <td th:text="${t.customer.name}">Customer</td>
                  <td><span class="badge bg-info text-dark" th:text="${t.billingType != null ? t.billingType : 'Regular'}">Regular</span></td>
                  <td th:text="${t.crane != null ? t.crane.craneNo : '-'}">KCN-01</td>
                  <td th:text="${t.tripDate}">2026-07-21</td>
                  <td th:text="${t.totalHours}">7.0</td>
                  <td th:text="'₹' + ${#numbers.formatDecimal(t.amount,0,'COMMA',2,'POINT')}">₹0.00</td>
                  <td>
                    <a th:href="@{'/tripsheets/edit/' + ${t.id}}" class="btn btn-sm btn-outline-primary">Edit</a>
                    <a th:href="@{'/tripsheets/print/' + ${t.id}}" target="_blank" class="btn btn-sm btn-outline-secondary" title="Print / Save as PDF">🖨️ PDF</a>
                    <a th:if="${!t.convertedToInvoice}" th:href="@{'/invoices/from-tripsheet/' + ${t.id}}" class="btn btn-sm btn-brand-green">→ Invoice</a>
                    <span th:if="${t.convertedToInvoice}" class="badge bg-secondary">Invoiced</span>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(tripSheets)}"><td colspan="8" class="text-center text-muted">No trip sheets yet</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
