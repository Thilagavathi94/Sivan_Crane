<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crane Trip Records - Sivan Crane Service</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: topbar}"></div>
<div class="d-flex">
  <div class="sidebar-col">
    <div th:replace="~{fragments :: sidebar('cranes')}"></div>
  </div>
  <div class="flex-grow-1 p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h3 class="mb-1" th:text="${crane.craneNo} + ' Trip Details'">Crane Trip Details</h3>
        <div class="text-muted">
          <span th:text="${crane.registrationNo}">TN38CT7504</span>
          <span> | Total Trips: </span>
          <strong th:text="${tripCount}">0</strong>
        </div>
      </div>
      <a th:href="@{/dashboard}" class="btn btn-outline-secondary">Back</a>
    </div>

    <div class="row g-3">
      <div class="col-md-4">
        <div class="card-panel">
          <div class="panel-title">Date-wise Trip Count</div>
          <table class="table table-sm">
            <thead><tr><th>Date</th><th>How Many Trips</th></tr></thead>
            <tbody>
              <tr th:each="entry : ${dateCounts}">
                <td th:text="${entry.key}">2026-07-24</td>
                <td class="fw-bold" th:text="${entry.value}">1</td>
              </tr>
              <tr th:if="${#maps.isEmpty(dateCounts)}"><td colspan="2" class="text-center text-muted">No trip records</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="col-md-8">
        <div class="card-panel">
          <div class="panel-title">Trip Records</div>
          <div class="table-responsive">
            <table class="table table-sm align-middle">
              <thead><tr><th>Date</th><th>Party</th><th>Hours</th><th>Amount</th><th>Print</th></tr></thead>
              <tbody>
                <tr th:each="t : ${tripSheets}">
                  <td th:text="${t.tripDate}">2026-07-24</td>
                  <td th:text="${t.customer != null ? t.customer.name : '-'}">Customer</td>
                  <td th:text="${t.totalHours}">0</td>
                  <td th:text="'₹' + ${#numbers.formatDecimal(t.amount,0,'COMMA',2,'POINT')}">₹0.00</td>
                  <td><a th:href="@{'/tripsheets/print/' + ${t.id}}" target="_blank" class="btn btn-sm btn-outline-secondary">PDF</a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(tripSheets)}"><td colspan="5" class="text-center text-muted">No trip records</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
