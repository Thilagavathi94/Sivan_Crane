<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drivers - Sivan Crane Service</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: topbar}"></div>
<div class="d-flex">
  <div class="sidebar-col">
    <div th:replace="~{fragments :: sidebar('drivers')}"></div>
  </div>
  <div class="flex-grow-1 p-4">

    <div class="row g-3">
      <div class="col-md-5">
        <div class="card-panel">
          <div class="panel-title">🚚 <span th:text="${driver.id != null ? 'Edit Driver' : 'Add Driver'}">Add Driver</span></div>
          <form th:action="@{/drivers/save}" th:object="${driver}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="mb-2">
              <label class="form-label">Driver Name *</label>
              <input type="text" th:field="*{name}" class="form-control" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Phone</label>
              <input type="text" th:field="*{phone}" class="form-control">
            </div>
            <div class="mb-2">
              <label class="form-label">License No</label>
              <input type="text" th:field="*{licenseNo}" class="form-control">
            </div>
            <button type="submit" class="btn btn-brand-orange w-100">Save Driver</button>
          </form>
        </div>
      </div>

      <div class="col-md-7">
        <div class="card-panel">
          <div class="panel-title">All Drivers</div>
          <div class="table-responsive">
            <table class="table table-sm">
              <thead><tr><th>Name</th><th>Phone</th><th>License No</th><th>Action</th></tr></thead>
              <tbody>
                <tr th:each="d : ${drivers}">
                  <td th:text="${d.name}">Murugan</td>
                  <td th:text="${d.phone}">9876543210</td>
                  <td th:text="${d.licenseNo}">TN-DL-00123</td>
                  <td>
                    <a th:href="@{'/drivers/edit/' + ${d.id}}" class="btn btn-sm btn-outline-primary">Edit</a>
                    <a th:href="@{'/drivers/delete/' + ${d.id}}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this driver?')">Delete</a>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(drivers)}"><td colspan="4" class="text-center text-muted">No drivers yet</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
