spring.application.name=Sivan Crane Service Management

# ===== XAMPP / MySQL Database Connection =====
# Make sure XAMPP's MySQL (Apache + MySQL) is running before starting this app.
# Create the database using database/schema.sql in phpMyAdmin OR let Hibernate auto-create it
# (spring.jpa.hibernate.ddl-auto=update will create/alter tables automatically).
spring.datasource.url=jdbc:mysql://localhost:3306/crane_management_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# ===== Server =====
server.port=8080
server.servlet.session.timeout=8h

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== Logging =====
logging.level.org.springframework.security=INFO
