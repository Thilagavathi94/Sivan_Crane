<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Login - Sivan Crane Service</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="login-wrapper">
  <div class="login-card">
    <div class="text-center mb-4">
      <div style="font-size:40px;">🏗️</div>
      <h4 class="fw-bold mt-2" style="color:var(--navy);">SIVAN CRANE SERVICE</h4>
      <p class="text-muted" style="font-size:13px;">Crane Management &amp; GST Billing Software</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger py-2">Invalid username or password.</div>
    <div th:if="${param.logout}" class="alert alert-success py-2">You have been logged out.</div>

    <form th:action="@{/login}" method="post">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" placeholder="admin" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn w-100 btn-brand-orange fw-bold py-2">Login</button>
    </form>
    <p class="text-center text-muted mt-3" style="font-size:12px;">Default: admin / admin123</p>
    <p class="text-center text-muted mt-3" style="font-size:11px;">© 2026 Sivan Crane Service. All rights reserved.</p>
  </div>
</div>
</body>
</html>
