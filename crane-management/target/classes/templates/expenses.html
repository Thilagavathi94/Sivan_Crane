<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Expenses - Sivan Crane Service</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: topbar}"></div>
<div class="d-flex">
  <div style="width:220px; flex-shrink:0;">
    <div th:replace="~{fragments :: sidebar('expenses')}"></div>
  </div>
  <div class="flex-grow-1 p-4">

    <div class="row g-3">
      <div class="col-md-5">
        <div class="card-panel">
          <div class="panel-title">💸 Add Expense</div>
          <form th:action="@{/expenses/save}" th:object="${expense}" method="post">
            <div class="mb-2">
              <label class="form-label">Date *</label>
              <input type="date" th:field="*{expenseDate}" class="form-control" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Category *</label>
              <select th:field="*{category}" class="form-select" required>
                <option value="Diesel">Diesel</option>
                <option value="Driver Advance">Driver Advance</option>
                <option value="Driver Salary">Driver Salary</option>
                <option value="Driver Bata">Driver Bata</option>
                <option value="Repair">Repair</option>
                <option value="Maintenance">Maintenance</option>
                <option value="Food">Food</option>
                <option value="Tyre">Tyre</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="mb-2">
              <label class="form-label">Crane (if applicable)</label>
              <select th:field="*{crane}" class="form-select">
                <option value="">-- None --</option>
                <option th:each="c : ${cranes}" th:value="${c.id}" th:text="${c.craneNo} + ' - ' + ${c.registrationNo}">Crane</option>
              </select>
            </div>
            <div class="mb-2">
              <label class="form-label">Driver (for advance, salary, bata)</label>
              <select th:field="*{driver}" class="form-select">
                <option value="">-- None --</option>
                <option th:each="d : ${drivers}" th:value="${d.id}" th:text="${d.name}">Driver</option>
              </select>
            </div>
            <div class="mb-2">
              <label class="form-label">Amount *</label>
              <input type="number" step="0.01" th:field="*{amount}" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Description</label>
              <input type="text" th:field="*{description}" class="form-control" placeholder="e.g. Diesel - TN38CT7504">
            </div>
            <button type="submit" class="btn btn-brand-orange w-100">Save Expense</button>
          </form>
        </div>
      </div>

      <div class="col-md-7">
        <div class="card-panel">
          <div class="panel-title">Recent Expenses</div>
          <div class="table-responsive">
            <table class="table table-sm">
              <thead><tr><th>Date</th><th>Category</th><th>Crane</th><th>Driver</th><th>Amount</th><th>Description</th><th>Action</th></tr></thead>
              <tbody>
                <tr th:each="e : ${expenses}">
                  <td th:text="${e.expenseDate}">2026-07-21</td>
                  <td th:text="${e.category}">Diesel</td>
                  <td th:text="${e.crane != null ? e.crane.craneNo : '-'}">-</td>
                  <td th:text="${e.driver != null ? e.driver.name : '-'}">-</td>
                  <td th:text="'₹' + ${#numbers.formatDecimal(e.amount,0,'COMMA',2,'POINT')}">₹0</td>
                  <td th:text="${e.description}">Description</td>
                  <td><a th:href="@{'/expenses/delete/' + ${e.id}}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this expense?')">Delete</a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(expenses)}"><td colspan="7" class="text-center text-muted">No expenses recorded yet</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
