<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers - Sivan Crane Service</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: topbar}"></div>
<div class="d-flex">
  <div class="sidebar-col">
    <div th:replace="~{fragments :: sidebar('customers')}"></div>
  </div>
  <div class="flex-grow-1 p-4">

    <div class="row g-3">
      <div class="col-md-5">
        <div class="card-panel">
          <div class="panel-title">👤 <span th:text="${customer.id != null ? 'Edit Customer' : 'Add Customer'}">Add Customer</span></div>
          <form th:action="@{/customers/save}" th:object="${customer}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="mb-2">
              <label class="form-label">Customer Name *</label>
              <input type="text" th:field="*{name}" class="form-control" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Phone</label>
              <input type="text" th:field="*{phone}" class="form-control">
            </div>
            <div class="mb-2">
              <label class="form-label">GST Number</label>
              <input type="text" th:field="*{gstNumber}" class="form-control">
            </div>
            <div class="mb-2">
              <label class="form-label">Address</label>
              <textarea th:field="*{address}" class="form-control" rows="2"></textarea>
            </div>
            <button type="submit" class="btn btn-brand-orange w-100">Save Customer</button>
          </form>
        </div>
      </div>

      <div class="col-md-7">
        <div class="card-panel">
          <div class="panel-title">Recent Customers</div>
          <div class="table-responsive">
            <table class="table table-sm">
              <thead><tr><th>#</th><th>Name</th><th>Phone</th><th>GST Number</th><th>Action</th></tr></thead>
              <tbody>
                <tr th:each="c, iter : ${customers}">
                  <td th:text="${iter.count}">1</td>
                  <td th:text="${c.name}">Siva Construction</td>
                  <td th:text="${c.phone}">9787654321</td>
                  <td th:text="${c.gstNumber}">33ABCCD1234F1Z5</td>
                  <td>
                    <a th:href="@{'/customers/edit/' + ${c.id}}" class="btn btn-sm btn-outline-primary">Edit</a>
                    <a th:href="@{'/customers/delete/' + ${c.id}}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this customer?')">Delete</a>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(customers)}"><td colspan="5" class="text-center text-muted">No customers yet</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
