<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Monthly Report</title><style>body{font-family:Arial,sans-serif;margin:28px;color:#15213d}h1{margin-bottom:4px}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{border:1px solid #94a3b8;padding:8px;text-align:left}th{background:#17213b;color:#fff}.amount{text-align:right}@page{size:A4;margin:12mm}</style></head>
<body>
  <h1>SIVAN CRANE SERVICE</h1><h2 th:text="'Monthly Report - ' + ${month}">Monthly Report</h2>
  <table><thead><tr><th>Date</th><th>Income</th><th>Expense</th><th>Profit</th></tr></thead><tbody>
    <tr th:each="day : ${dailySummaries}"><td th:text="${day.date}">2026-09-01</td><td class="amount" th:text="'₹' + ${#numbers.formatDecimal(day.income,0,'COMMA',2,'POINT')}">₹0.00</td><td class="amount" th:text="'₹' + ${#numbers.formatDecimal(day.expense,0,'COMMA',2,'POINT')}">₹0.00</td><td class="amount" th:text="'₹' + ${#numbers.formatDecimal(day.profit,0,'COMMA',2,'POINT')}">₹0.00</td></tr>
  </tbody></table>
</body>
</html>
