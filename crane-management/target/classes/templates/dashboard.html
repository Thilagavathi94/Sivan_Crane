<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Sivan Crane Service</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: topbar}"></div>

<div class="d-flex">
  <div class="sidebar-col">
    <div th:replace="~{fragments :: sidebar('dashboard')}"></div>
  </div>

  <div class="flex-grow-1 p-4">
    <div class="row g-3 mb-3">
      <div class="col-md-3">
        <div class="stat-card">
          <div class="stat-value" th:text="${totalCranes}">0</div>
          <div class="stat-label">Total Cranes</div>
        </div>
      </div>
    </div>

    <div class="card-panel">
      <div class="panel-title">Crane Status</div>
      <div class="table-responsive">
        <table class="table table-sm align-middle">
          <thead>
            <tr><th>Crane No</th><th>Registration No</th><th>Type</th><th>Capacity</th><th>Trips</th></tr>
          </thead>
          <tbody>
            <tr th:each="c : ${cranes}">
              <td>
                <a th:href="@{'/cranes/' + ${c.id} + '/trip-records'}" th:text="${c.craneNo}">KCN-01</a>
              </td>
              <td th:text="${c.registrationNo}">TN38CT7504</td>
              <td th:text="${c.type}">Hydra</td>
              <td th:text="${c.capacity}">12 Ton</td>
              <td><a th:href="@{'/cranes/' + ${c.id} + '/trip-records'}" class="btn btn-sm btn-brand-blue">Trip Details</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(cranes)}"><td colspan="5" class="text-center text-muted">No cranes yet</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

</body>
</html>
